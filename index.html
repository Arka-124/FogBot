<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FogBot — Authorized Personnel Login | SIH 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Google reCAPTCHA v2 API Script -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

  <!-- Background Cyber Ambient Effects -->
  <div class="ambient-glow ambient-glow--top" aria-hidden="true"></div>
  <div class="ambient-glow ambient-glow--bottom" aria-hidden="true"></div>
  <div class="radar-lines" aria-hidden="true"></div>

  <!-- Header / Navigation Bar -->
  <header class="portal-header">
    <div class="portal-header__brand">
      <span class="portal-header__wordmark">FogBot</span>
      <span class="portal-header__divider" aria-hidden="true"></span>
      <img src="assets/nmdc-logo.png" alt="NMDC Logo" class="portal-header__logo">
      <img src="assets/sih-logo.png" alt="SIH 2026 Logo" class="portal-header__logo">
    </div>
    <div class="portal-header__actions">
      <a href="landing.html" class="portal-header__link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        System Overview
      </a>
    </div>
  </header>

  <!-- Main Login Container -->
  <main class="login-wrapper">
    <div class="login-card">
      <!-- Tactical Corner Accents -->
      <span class="corner corner--tl" aria-hidden="true"></span>
      <span class="corner corner--tr" aria-hidden="true"></span>
      <span class="corner corner--bl" aria-hidden="true"></span>
      <span class="corner corner--br" aria-hidden="true"></span>

      <!-- Card Header -->
      <div class="login-card__header">
        <div class="status-badge">
          <span class="status-badge__dot"></span>
          <span class="status-badge__text">SECURE TELEMETRY GATEWAY</span>
        </div>
        <h1 class="login-card__title">Command Portal Login</h1>
        <p class="login-card__subtitle">Enter operator credentials to authenticate with the Bailadila Mine Command Center.</p>
      </div>

      <!-- Live Feedback Notification Banner -->
      <div id="feedbackBanner" class="feedback-banner" role="alert" aria-live="polite"></div>

      <!-- Login Form (No registration page) -->
      <form id="loginForm" class="login-form" novalidate>
        
        <!-- User ID Field -->
        <div class="form-group">
          <label for="userId" class="form-label">
            <span>OPERATOR USER ID</span>
          </label>
          <div class="input-container">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input 
              type="text" 
              id="userId" 
              name="userId" 
              class="form-input" 
              placeholder="e.g. admin" 
              required 
              autocomplete="username"
              autofocus
            >
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">
            <span>SECURITY KEY / PASSWORD</span>
          </label>
          <div class="input-container">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="••••••••••••" 
              required 
              autocomplete="current-password"
            >
            <button type="button" id="togglePasswordBtn" class="toggle-password" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Google reCAPTCHA v2 Widget -->
        <div class="form-group form-group--captcha">
          <div 
            class="g-recaptcha" 
            data-sitekey="6LekebUtAAAAAEiqVaTTW15PdF-Z2ZH47YNGUalw"
            data-theme="dark"
            data-callback="onRecaptchaSuccess"
            data-expired-callback="onRecaptchaExpired"
          ></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn-submit">
          <span class="btn-submit__spinner" id="btnSpinner" aria-hidden="true"></span>
          <span class="btn-submit__text" id="btnText">Authenticate &amp; Enter</span>
        </button>

      </form>

      <!-- Card Footer Notice -->
      <div class="login-card__footer">
        <div class="demo-credentials">
          <span class="demo-credentials__label">Demo Credentials:</span>
          <code>User ID: admin</code>
          <span class="demo-credentials__divider">|</span>
          <code>Password: password123</code>
        </div>
        <div class="security-meta">
          <span>Protected by 256-bit SSL &bull; Problem Statement SIH26007</span>
        </div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
